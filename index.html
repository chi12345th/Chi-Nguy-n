<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhãn dán điểm thi</title>
    <style>
        .score-table {
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            background-color: #fff;
            margin: 20px;
        }
        .score-table th, 
        .score-table td {
            padding: 10px 15px;
        }
        .col-name {
            border: 2px solid blue;
            background-color: #f0f4ff;
            font-weight: bold;
        }
        .col-score-header {
            border: 2px solid blue;
            background-color: #eef2ff;
            font-weight: bold;
        }
        .col-math {
            border: 2px solid red;
            background-color: #fff5f5;
        }
        .col-physics {
            border: 2px solid #cccc00;
            background-color: #fffdf0;
        }
        .col-chemistry {
            border: 2px solid green;
            background-color: #f0fff0;
        }
    </style>
</head>
<body>

    <table class="score-table">
        <tr>
            <th rowspan="2" class="col-name">Họ tên</th>
            <th colspan="3" class="col-score-header">Điểm thi</th>
        </tr>
        <tr>
            <td class="col-math">Toán</td>
            <td class="col-physics">Vật lí</td>
            <td class="col-chemistry">Hóa học</td>
        </tr>
    </table>

</body>
</html>
